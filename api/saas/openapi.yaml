    post:
      tags: [InboxesPublic]
      summary: "Sincronizar ambiente WhatsApp (público)"
      operationId: "publicSyncWhatsappEnvironment"
      security: []
      parameters:
        - $ref: "#/components/parameters/inboxIdPath"
      requestBody:
        $ref: "#/components/requestBodies/GenericCreateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
  /Autonomia/Saas/Inboxes/{inboxId}/ConnectionLink:
