components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    productIdPath:
      name: productId
      in: path
      required: true
      schema:
        type: string
    documentIdPath:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    accountIdPath:
      name: accountId
      in: path
