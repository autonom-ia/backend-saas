      operationId: "updateProductParameter"
      parameters:
        - $ref: "#/components/parameters/parameterIdPath"
      requestBody:
        $ref: "#/components/requestBodies/GenericUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    delete:
      tags: [ProductParameters]
      summary: "Excluir parâmetro de produto"
      operationId: "deleteProductParameter"
      parameters:
        - $ref: "#/components/parameters/parameterIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
  /Autonomia/Saas/ProductParametersStandard:
    get:
      tags: [ProductParameters]
      summary: "Listar parâmetros padrão de produto"
      operationId: "listProductParametersStandard"
      parameters:
