openapi: "3.0.0"
info:
  title: "Autonomia SaaS API"
  version: "1.0.0"
  description: "Especificação OpenAPI do serviço /backend/api/saas."
servers:
  - url: "https://api-saas.autonomia.site"
    description: "Produção"
security:
  - bearerAuth: []
paths:
  /Autonomia/Saas/Products:
    get:
      tags: [Products]
      summary: "Listar produtos"
      operationId: "listProducts"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    post:
      tags: [Products]
      summary: "Criar produto"
      operationId: "createProduct"
      requestBody:
        $ref: "#/components/requestBodies/ProductCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success201"
  /Autonomia/Saas/ProductTypes:
    get:
      tags: [Products]
      summary: "Listar tipos de produto"
      operationId: "listProductTypes"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
  /Autonomia/Saas/Products/{productId}:
    get:
      tags: [Products]
      summary: "Obter produto por ID"
      operationId: "getProduct"
      parameters:
        - $ref: "#/components/parameters/productIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    put:
      tags: [Products]
      summary: "Atualizar produto"
      operationId: "updateProduct"
      parameters:
        - $ref: "#/components/parameters/productIdPath"
      requestBody:
        $ref: "#/components/requestBodies/ProductUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    delete:
      tags: [Products]
      summary: "Remover produto"
      operationId: "deleteProduct"
      parameters:
        - $ref: "#/components/parameters/productIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"

  /Autonomia/Saas/KnowledgeDocuments:
    get:
      tags: [KnowledgeDocuments]
      summary: "Listar documentos de conhecimento"
      operationId: "listKnowledgeDocuments"
      parameters:
        - $ref: "#/components/parameters/accountIdQueryOptional"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    post:
      tags: [KnowledgeDocuments]
      summary: "Criar documento de conhecimento"
      operationId: "createKnowledgeDocument"
      requestBody:
        $ref: "#/components/requestBodies/GenericCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success201"
  /Autonomia/Saas/KnowledgeDocuments/{documentId}:
    get:
      tags: [KnowledgeDocuments]
      summary: "Obter documento de conhecimento"
      operationId: "getKnowledgeDocument"
      parameters:
        - $ref: "#/components/parameters/documentIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    put:
      tags: [KnowledgeDocuments]
      summary: "Atualizar documento de conhecimento"
      operationId: "updateKnowledgeDocument"
      parameters:
        - $ref: "#/components/parameters/documentIdPath"
      requestBody:
        $ref: "#/components/requestBodies/GenericUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    delete:
      tags: [KnowledgeDocuments]
      summary: "Excluir documento de conhecimento"
      operationId: "deleteKnowledgeDocument"
