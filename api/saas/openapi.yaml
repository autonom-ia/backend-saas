          $ref: "#/components/responses/Success200"
    put:
      tags: [Accounts]
      summary: "Atualizar conta"
      operationId: "updateAccount"
      parameters:
        - $ref: "#/components/parameters/accountIdPath"
      requestBody:
        $ref: "#/components/requestBodies/AccountUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    delete:
      tags: [Accounts]
      summary: "Excluir conta"
      operationId: "deleteAccount"
      parameters:
        - $ref: "#/components/parameters/accountIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
  /Autonomia/Saas/Accounts/CompleteSubscription:
    post:
      tags: [Accounts]
      summary: "Completar assinatura da conta"
      operationId: "completeAccountSubscription"
      requestBody:
        $ref: "#/components/requestBodies/CompleteSubscriptionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
  /Autonomia/Saas/Accounts/{accountId}/CancelSubscription:
    post:
      tags: [Accounts]
      summary: "Cancelar assinatura da conta"
      operationId: "cancelAccountSubscription"
      parameters:
        - $ref: "#/components/parameters/accountIdPath"
      requestBody:
        $ref: "#/components/requestBodies/GenericUpdateRequest"
      responses:
