      summary: "Sincronizar documento com processador externo"
      operationId: "syncKnowledgeDocument"
      parameters:
        - $ref: "#/components/parameters/documentIdPath"
      responses:
        "200":
          $ref: "#/components/responses/Success200"

  /Autonomia/Saas/Accounts:
    get:
      tags: [Accounts]
      summary: "Listar contas"
      operationId: "listAccounts"
      parameters:
        - $ref: "#/components/parameters/productIdQueryOptional"
        - $ref: "#/components/parameters/domainQueryOptional"
      responses:
        "200":
          $ref: "#/components/responses/Success200"
    post:
      tags: [Accounts]
      summary: "Criar conta"
      operationId: "createAccount"
      requestBody:
        $ref: "#/components/requestBodies/AccountCreateRequest"
